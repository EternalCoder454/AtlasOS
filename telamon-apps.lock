# The Telamon apps and telamon-framework that go in the image, each pinned to one
# commit. CI and `just build` build exactly these; nothing follows a branch.
# Change a pin with `just pins-update [name]` (or the "Update Telamon app pins"
# workflow's pull request), never by hand-typing a hash; scripts/telamon-pins.py
# checks the file.
#
# RENAME TO TELAMON (phase 3): except for the framework (v2.0.0), these pins are
# still the commits from before each app was renamed, so that `just pins` and
# `pins-update` keep verifying them. The image's checks (build_files/apps.sh) are
# for the renamed apps: before the rename branch is merged, and after every
# app's rename pull request is, run `just pins-update` (each app moves to its
# newest release or its main branch's head) and commit this file; until then
# the image does not build in CI. See CI.md, "The app pins".
