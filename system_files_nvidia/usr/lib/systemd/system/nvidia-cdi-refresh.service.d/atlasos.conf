# Only with an NVIDIA card (PCI vendor 0x10de). Without one, nvidia-smi fails,
# the service retries until its start limit, and it and its .path unit end up
# failed. The atlasos-nvidia image on another machine just skips it.
[Service]
ExecCondition=/bin/sh -c 'grep -qx 0x10de /sys/bus/pci/devices/*/vendor'
