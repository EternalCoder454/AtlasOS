name: Build AtlasOS

on:
  push:
    branches: [main, beta]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main, beta]
  # Daily, to pick up Fedora's updates. Skipped when neither the base image
  # nor this repo changed since the last published build; see "Decide".
  # The weekly stable release is promote-stable.yml, which copies the newest
  # testing image instead of building again.
  schedule:
    - cron: "05 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its running build. Branch builds
# finish, so a cancel can't leave the tags half-pushed or an image unsigned.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Registry paths must be lowercase.
  IMAGE_REGISTRY: ghcr.io/eternalcoder454
  IMAGE_NAME: atlasos
  BASE_IMAGE: quay.io/fedora/fedora-kinoite:44

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    # For the nvidia job, which builds on the image this job pushed.
    outputs:
      pushed: ${{ steps.push.outcome == 'success' }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Atlas apps' source (Atlas Updater and atlas-core, main): the
      # Containerfile builds their RPMs from it. If the repository is private,
      # store a token that can read it in the ATLAS_UPDATER_TOKEN secret.
      - name: Checkout Atlas Updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-updater
          ref: main
          path: atlas-updater
          token: ${{ secrets.ATLAS_UPDATER_TOKEN || github.token }}

      # main publishes :testing, beta publishes :beta. (:stable and :latest
      # come from promote-stable.yml.) Pull requests build and lint but
      # never push.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_KEY_SET: ${{ secrets.NVIDIA_SIGNING_KEY != '' }}
        run: |
          case "${GITHUB_REF_NAME}" in
            main) tag="testing" ;;
            beta) tag="beta" ;;
            *) tag="pr" ;;
          esac
          push=false
          if [ "${GITHUB_EVENT_NAME}" != pull_request ] && [ "$tag" != pr ]; then
            push=true
          fi

          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }

          # The Kinoite build to use, by digest, so the image records exactly
          # what it was built on.
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://${BASE_IMAGE}")
          base="${BASE_IMAGE}@${digest}"

          # A scheduled run with nothing new to build stops here: the image
          # already published for this branch was built from this commit on
          # this same Kinoite. That saves a whole build most days.
          skip=false
          updater=$(git -C atlas-updater rev-parse HEAD)
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            # No published image yet (or the registry is down) means build.
            labels='{}'
            if json=$(skopeo inspect --creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}" 2>/dev/null); then
              labels=$(jq -c '.Labels // {}' <<<"$json")
            fi
            if [ "$(jq -r '."org.atlasos.base-image" // ""' <<<"$labels")" = "$base" ] &&
               [ "$(jq -r '."net.eterneon.atlas.updater.revision" // ""' <<<"$labels")" = "$updater" ] &&
               [ "$(jq -r '."org.opencontainers.image.revision" // ""' <<<"$labels")" = "${GITHUB_SHA}" ]; then
              skip=true
            fi
            # atlasos-nvidia only builds on a pushed atlasos, so a failed
            # NVIDIA build would otherwise stay stale until the next commit.
            # Its labels come from the atlasos image it was built on.
            if [ "$skip" = true ] && [ "$NVIDIA_KEY_SET" = true ]; then
              nv='{}'
              if json=$(skopeo inspect --creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
                "docker://${IMAGE_REGISTRY}/atlasos-nvidia:${tag}" 2>/dev/null); then
                nv=$(jq -c '.Labels // {}' <<<"$json")
              fi
              if [ "$(jq -r '."org.opencontainers.image.version" // ""' <<<"$nv")" != \
                 "$(jq -r '."org.opencontainers.image.version" // ""' <<<"$labels")" ] ||
                 [ "$(jq -r '."org.opencontainers.image.revision" // ""' <<<"$nv")" != "${GITHUB_SHA}" ]; then
                skip=false
                echo "::notice::atlasos-nvidia:${tag} is behind atlasos; building both."
              fi
            fi
            [ "$skip" = false ] || echo "::notice::Nothing new since the last ${tag} build; skipping."
          fi

          date=$(date -u +%Y%m%d)
          {
            echo "tag=$tag"
            echo "push=$push"
            echo "base=$base"
            echo "updater=$updater"
            echo "skip=$skip"
            echo "date=$date"
            echo "version=44.$date"
            echo "week=$(date -u +%G-W%V)"
          } >>"$GITHUB_OUTPUT"

      - name: Install just
        if: steps.decide.outputs.skip != 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Lint
        if: steps.decide.outputs.skip != 'true'
        run: just lint

      # The runner's disk is too small for a 7 GB image, its rechunked copy
      # and Podman's working space without clearing the preinstalled SDKs.
      - name: Maximize build space
        if: steps.decide.outputs.skip != 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # dnf's metadata and packages, bound into the build at /var/cache/libdnf5
      # by `just build`. Keyed by the week, so it follows Fedora's updates: a
      # new week starts from the last one's and saves once. (A key that never
      # changes is an exact hit forever, is never saved again, and goes stale.)
      - name: Cache dnf downloads
        if: steps.decide.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/dnf
          key: dnf-f44-${{ steps.decide.outputs.week }}
          restore-keys: dnf-f44-

      - name: Build
        if: steps.decide.outputs.skip != 'true'
        env:
          IMAGE_VERSION: ${{ steps.decide.outputs.version }}
          # `just build` passes this as the atlas-updater build context.
          ATLAS_UPDATER_SRC: ${{ github.workspace }}/atlas-updater
        run: |
          just build "${{ steps.decide.outputs.tag }}" \
            --build-arg BASE_IMAGE="${{ steps.decide.outputs.base }}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label net.eterneon.atlas.updater.revision="${{ steps.decide.outputs.updater }}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.url="https://github.com/${GITHUB_REPOSITORY}"
          # Each week's cache starts from the last one, so drop packages
          # nothing has downloaded for a month before it is saved.
          find build/cache/dnf -name '*.rpm' -mtime +30 -delete

      # Smaller updates for users. Only for images that get pushed.
      - name: Rechunk
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        run: just rechunk "${{ steps.decide.outputs.tag }}"

      - name: Log in to ghcr.io
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # testing -> testing, testing-44.YYYYMMDD; beta -> beta, beta-44.YYYYMMDD.
      # The version is the one in the image's org.opencontainers.image.version
      # label (set by `just build` from IMAGE_VERSION).
      - name: Push
        id: push
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          version="${{ steps.decide.outputs.version }}"
          have=$(podman image inspect "localhost/${IMAGE_NAME}:${tag}" |
            jq -r '.[0].Labels["org.opencontainers.image.version"]')
          [ "$have" = "$version" ] || { echo "label says $have, tag says $version" >&2; exit 1; }
          tags=("$tag" "$tag-$version")
          for t in "${tags[@]}"; do
            podman push --digestfile=/tmp/digest "localhost/${IMAGE_NAME}:${tag}" \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${t}"
          done
          echo "digest=$(cat /tmp/digest)" >>"$GITHUB_OUTPUT"

      # Signing starts once the SIGNING_SECRET repository secret holds a cosign
      # private key (see the README). Until then images are pushed unsigned.
      - name: Check for a signing key
        id: signing
        if: steps.push.outcome == 'success'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: echo "enabled=$([ -n "$SIGNING_SECRET" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.signing.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      - name: Sign
        if: steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          # Empty unless the key was made with a password (see the README).
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # The old bundle format is what rpm-ostree and containers/image can
          # verify (containers/container-libs#388, coreos/rpm-ostree#5509).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

  # atlasos-nvidia: the image just pushed plus NVIDIA's driver
  # (Containerfile.nvidia), with the same tags. Its kernel modules are signed
  # with the AtlasOS module key, which CI reads from the NVIDIA_SIGNING_KEY
  # secret (see DEV.md); without it this job only leaves a notice. Pull
  # requests don't build it: it starts from the pushed image.
  nvidia:
    name: Build and push (NVIDIA)
    needs: build
    if: needs.build.outputs.pushed == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      NVIDIA_IMAGE: atlasos-nvidia
    steps:
      - name: Check for the module signing key
        id: key
        env:
          KEY: ${{ secrets.NVIDIA_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::No NVIDIA_SIGNING_KEY secret; atlasos-nvidia not built."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        if: steps.key.outputs.enabled == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Maximize build space
        if: steps.key.outputs.enabled == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Log in to ghcr.io
        if: steps.key.outputs.enabled == 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exactly the image the build job pushed, by digest. Its labels (version,
      # revision, base image) carry over to the NVIDIA image.
      - name: Build
        if: steps.key.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.NVIDIA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ needs.build.outputs.digest }}"
          podman tag "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ needs.build.outputs.digest }}" "localhost/${IMAGE_NAME}:${tag}"
          key="${RUNNER_TEMP}/nvidia-signing.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" >"$key")
          NVIDIA_SIGNING_KEY="$key" just build-nvidia "$tag"

      - name: Rechunk
        if: steps.key.outputs.enabled == 'true'
        run: just rechunk "${{ needs.build.outputs.tag }}" "${NVIDIA_IMAGE}"

      - name: Push
        id: push
        if: steps.key.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          version="${{ needs.build.outputs.version }}"
          have=$(podman image inspect "localhost/${NVIDIA_IMAGE}:${tag}" |
            jq -r '.[0].Labels["org.opencontainers.image.version"]')
          [ "$have" = "$version" ] || { echo "label says $have, tag says $version" >&2; exit 1; }
          for t in "$tag" "$tag-$version"; do
            podman push --digestfile=/tmp/digest "localhost/${NVIDIA_IMAGE}:${tag}" \
              "${IMAGE_REGISTRY}/${NVIDIA_IMAGE}:${t}"
          done
          echo "digest=$(cat /tmp/digest)" >>"$GITHUB_OUTPUT"

      - name: Check for a signing key
        id: signing
        if: steps.push.outcome == 'success'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: echo "enabled=$([ -n "$SIGNING_SECRET" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.signing.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      - name: Sign
        if: steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${NVIDIA_IMAGE}@${{ steps.push.outputs.digest }}"
