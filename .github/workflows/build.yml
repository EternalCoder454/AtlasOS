name: Build AtlasOS

on:
  push:
    branches: [main, beta]
    paths-ignore: ["**.md"]
    # Tags build and lint (on the VPS runner) but publish nothing: :stable
    # comes from promote-stable.yml.
    tags: ["*"]
  pull_request:
    branches: [main, beta]
  # Daily, to pick up Fedora's updates. Skipped when neither the base image
  # nor this repo changed since the last published build; see "Decide".
  # The weekly stable release is promote-stable.yml, which copies the newest
  # testing image instead of building again.
  schedule:
    - cron: "05 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its running build. Branch builds
# finish, so a cancel can't leave the tags half-pushed or an image unsigned.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Registry paths must be lowercase.
  IMAGE_REGISTRY: ghcr.io/eternalcoder454
  IMAGE_NAME: atlasos
  NVIDIA_IMAGE: atlasos-nvidia
  BASE_IMAGE: quay.io/fedora/fedora-kinoite:44

jobs:
  # Where the builds run (CI.md): the VPS runner (the self-hosted runner
  # labelled atlasos-vps) for pushes to main, the daily schedule, manual runs on
  # main and tags; GitHub's runners for pull requests and beta. When the VPS
  # runner is offline, or its status can't be read, GitHub's runners build
  # everything.
  runner:
    name: Pick a runner
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      kind: ${{ steps.pick.outputs.kind }}
    steps:
      - name: Pick
        id: pick
        env:
          # A fine-grained token for this repository with "Administration:
          # read" (listing runners needs it; GITHUB_TOKEN can't have it).
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          kind=hosted
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            push:refs/heads/main | schedule:refs/heads/main | workflow_dispatch:refs/heads/main | push:refs/tags/*)
              if [ -z "$GH_TOKEN" ]; then
                echo "::notice::No RUNNER_STATUS_TOKEN secret, so the VPS runner can't be checked; building on GitHub's runner."
              elif status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
                --jq '[.runners[] | select(any(.labels[]; .name == "atlasos-vps")) | .status] | if index("online") then "online" else "offline" end' 2>"$RUNNER_TEMP/gh.err"); then
                if [ "$status" = online ]; then
                  kind=vps
                else
                  echo "::notice::The VPS runner is offline; building on GitHub's runner."
                fi
              else
                echo "::warning::Couldn't read the VPS runner's status ($(tr '\n' ' ' <"$RUNNER_TEMP/gh.err")); building on GitHub's runner."
              fi
              ;;
          esac
          if [ "$kind" = vps ]; then
            labels='["self-hosted","atlasos-vps"]'
          else
            labels='"ubuntu-26.04"'
          fi
          echo "Runner: $kind"
          {
            echo "kind=$kind"
            echo "labels=$labels"
          } >>"$GITHUB_OUTPUT"

  build:
    # The runner kind in the name is what scripts/ci-times.sh sorts by.
    name: Build and push (${{ needs.runner.outputs.kind }})
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Atlas apps' source (Atlas Updater and atlas-core, main): the
      # Containerfile builds their RPMs from it. If the repository is private,
      # store a token that can read it in the ATLAS_UPDATER_TOKEN secret.
      - name: Checkout Atlas Updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-updater
          ref: main
          path: atlas-updater
          token: ${{ secrets.ATLAS_UPDATER_TOKEN || github.token }}

      # main publishes :testing, beta publishes :beta. (:stable and :latest
      # come from promote-stable.yml.) Pull requests and tags build and
      # lint but never push.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_KEY_SET: ${{ secrets.NVIDIA_SIGNING_KEY != '' }}
        run: |
          # The full ref: a tag named "main" must not publish :testing.
          case "${GITHUB_REF}" in
            refs/heads/main) tag="testing" ;;
            refs/heads/beta) tag="beta" ;;
            *) tag="pr" ;;
          esac
          push=false
          if [ "${GITHUB_EVENT_NAME}" != pull_request ] && [ "$tag" != pr ]; then
            push=true
          fi

          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }

          # The Kinoite build to use, by digest, so the image records exactly
          # what it was built on.
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://${BASE_IMAGE}")
          base="${BASE_IMAGE}@${digest}"

          # A scheduled run with nothing new to build stops here: the image
          # already published for this branch was built from this commit on
          # this same Kinoite. That saves a whole build most days.
          skip=false
          updater=$(git -C atlas-updater rev-parse HEAD)
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            # No published image yet (or the registry is down) means build.
            labels='{}'
            if json=$(skopeo inspect --creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}" 2>/dev/null); then
              labels=$(jq -c '.Labels // {}' <<<"$json")
            fi
            if [ "$(jq -r '."org.atlasos.base-image" // ""' <<<"$labels")" = "$base" ] &&
               [ "$(jq -r '."net.eterneon.atlas.updater.revision" // ""' <<<"$labels")" = "$updater" ] &&
               [ "$(jq -r '."org.opencontainers.image.revision" // ""' <<<"$labels")" = "${GITHUB_SHA}" ]; then
              skip=true
            fi
            # atlasos-nvidia only builds on a pushed atlasos, so a failed
            # NVIDIA build would otherwise stay stale until the next commit.
            # Its labels come from the atlasos image it was built on.
            if [ "$skip" = true ] && [ "$NVIDIA_KEY_SET" = true ]; then
              nv='{}'
              if json=$(skopeo inspect --creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
                "docker://${IMAGE_REGISTRY}/atlasos-nvidia:${tag}" 2>/dev/null); then
                nv=$(jq -c '.Labels // {}' <<<"$json")
              fi
              if [ "$(jq -r '."org.opencontainers.image.version" // ""' <<<"$nv")" != \
                 "$(jq -r '."org.opencontainers.image.version" // ""' <<<"$labels")" ] ||
                 [ "$(jq -r '."org.opencontainers.image.revision" // ""' <<<"$nv")" != "${GITHUB_SHA}" ]; then
                skip=false
                echo "::notice::atlasos-nvidia:${tag} is behind atlasos; building both."
              fi
            fi
            [ "$skip" = false ] || echo "::notice::Nothing new since the last ${tag} build; skipping."
          fi

          date=$(date -u +%Y%m%d)
          {
            echo "tag=$tag"
            echo "push=$push"
            echo "base=$base"
            echo "updater=$updater"
            echo "skip=$skip"
            echo "date=$date"
            echo "version=44.$date"
            echo "week=$(date -u +%G-W%V)"
          } >>"$GITHUB_OUTPUT"

      - name: Install just
        if: steps.decide.outputs.skip != 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Lint
        if: steps.decide.outputs.skip != 'true'
        run: just lint

      # The runner's disk is too small for a 7 GB image, its rechunked copy
      # (3 GB, compressed) and Podman's working space without clearing the
      # preinstalled SDKs.
      # (Not on the VPS, whose disk keeps the caches.)
      - name: Maximize build space
        if: steps.decide.outputs.skip != 'true' && needs.runner.outputs.kind == 'hosted'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # dnf's metadata and packages, bound into the build at /var/cache/libdnf5
      # by `just build`. Keyed by the week, so it follows Fedora's updates: a
      # new week starts from the last one's and saves once. (A key that never
      # changes is an exact hit forever, is never saved again, and goes stale.)
      # The VPS keeps its own in ATLAS_DNF_CACHE, with Podman's layer cache and
      # the Rust build cache.
      - name: Cache dnf downloads
        if: steps.decide.outputs.skip != 'true' && needs.runner.outputs.kind == 'hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/dnf
          key: dnf-f44-${{ steps.decide.outputs.week }}
          restore-keys: dnf-f44-

      - name: Build
        if: steps.decide.outputs.skip != 'true'
        env:
          IMAGE_VERSION: ${{ steps.decide.outputs.version }}
          # `just build` passes this as the atlas-updater build context.
          ATLAS_UPDATER_SRC: ${{ github.workspace }}/atlas-updater
        run: |
          just build "${{ steps.decide.outputs.tag }}" \
            --build-arg BASE_IMAGE="${{ steps.decide.outputs.base }}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label net.eterneon.atlas.updater.revision="${{ steps.decide.outputs.updater }}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.url="https://github.com/${GITHUB_REPOSITORY}"
          # Each week's cache starts from the last one, so drop packages
          # nothing has downloaded for a month before it is saved.
          find "${ATLAS_DNF_CACHE:-build/cache/dnf}" -name '*.rpm' -mtime +30 -delete

      # Smaller updates for users. Only for images that get pushed. Into an
      # OCI directory in the job's temporary directory, which the runner
      # empties after the job; Push uploads it from there as it is.
      - name: Rechunk
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        run: just rechunk "${{ steps.decide.outputs.tag }}" "${IMAGE_NAME}" "${RUNNER_TEMP:?}/rechunked"

      - name: Log in to ghcr.io
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # In this job's temporary directory, which the runner empties after
          # every job, so no credentials stay behind on the VPS runner. Podman
          # and skopeo read REGISTRY_AUTH_FILE, cosign reads DOCKER_CONFIG.
          mkdir -p "$RUNNER_TEMP/auth"
          {
            echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth/config.json"
            echo "DOCKER_CONFIG=$RUNNER_TEMP/auth"
          } >>"$GITHUB_ENV"
          printf '%s' "$TOKEN" | podman login --authfile "$RUNNER_TEMP/auth/config.json" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      # testing -> testing, testing-44.YYYYMMDD; beta -> beta, beta-44.YYYYMMDD.
      # The version is the one in the image's org.opencontainers.image.version
      # label (set by `just build` from IMAGE_VERSION).
      - name: Push
        id: push
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          version="${{ steps.decide.outputs.version }}"
          src="oci:$RUNNER_TEMP/rechunked:${tag}"
          have=$(skopeo inspect --config "$src" |
            jq -r '.config.Labels["org.opencontainers.image.version"]')
          [ "$have" = "$version" ] || { echo "label says $have, tag says $version" >&2; exit 1; }
          # The layers go up as the chunker compressed them, and the registry
          # already has every one that didn't change.
          tags=("$tag" "$tag-$version")
          for t in "${tags[@]}"; do
            skopeo copy --preserve-digests --retry-times 3 --digestfile "$RUNNER_TEMP/digest" \
              "$src" "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${t}"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >>"$GITHUB_OUTPUT"

      # Signing starts once the SIGNING_SECRET repository secret holds a cosign
      # private key (see the README). Until then images are pushed unsigned.
      - name: Check for a signing key
        id: signing
        if: steps.push.outcome == 'success'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: echo "enabled=$([ -n "$SIGNING_SECRET" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.signing.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      - name: Sign
        if: steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          # Empty unless the key was made with a password (see the README).
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # The old bundle format is what rpm-ostree and containers/image can
          # verify (containers/container-libs#388, coreos/rpm-ostree#5509).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      # atlasos-nvidia: this image plus NVIDIA's driver (Containerfile.nvidia),
      # with the same tags. It builds on the image `just build` left in
      # Podman's storage, with the same files and labels as the one just
      # pushed and every layer already there: the pushed (rechunked) image
      # shares none, so it would be another 9 GB download, more than the VPS
      # runner's disk has room for beside its cache. Its kernel modules are
      # signed with the AtlasOS module key, which CI reads from the
      # NVIDIA_SIGNING_KEY secret (see DEV.md); without it this only leaves a
      # notice. Pull requests don't build it.
      - name: Check for the module signing key
        id: nvidia
        if: steps.push.outcome == 'success'
        env:
          KEY: ${{ secrets.NVIDIA_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::No NVIDIA_SIGNING_KEY secret; atlasos-nvidia not built."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Build NVIDIA
        if: steps.nvidia.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.NVIDIA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/nvidia-signing.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" >"$key")
          NVIDIA_SIGNING_KEY="$key" just build-nvidia "${{ steps.decide.outputs.tag }}"

      # Into the same directory, which `just rechunk` empties: atlasos is
      # pushed by now.
      - name: Rechunk NVIDIA
        if: steps.nvidia.outputs.enabled == 'true'
        run: just rechunk "${{ steps.decide.outputs.tag }}" "${NVIDIA_IMAGE}" "${RUNNER_TEMP:?}/rechunked"

      - name: Push NVIDIA
        id: push-nvidia
        if: steps.nvidia.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          version="${{ steps.decide.outputs.version }}"
          src="oci:$RUNNER_TEMP/rechunked:${tag}"
          have=$(skopeo inspect --config "$src" |
            jq -r '.config.Labels["org.opencontainers.image.version"]')
          [ "$have" = "$version" ] || { echo "label says $have, tag says $version" >&2; exit 1; }
          for t in "$tag" "$tag-$version"; do
            skopeo copy --preserve-digests --retry-times 3 --digestfile "$RUNNER_TEMP/digest" \
              "$src" "docker://${IMAGE_REGISTRY}/${NVIDIA_IMAGE}:${t}"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >>"$GITHUB_OUTPUT"

      - name: Sign NVIDIA
        if: steps.push-nvidia.outcome == 'success' && steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${NVIDIA_IMAGE}@${{ steps.push-nvidia.outputs.digest }}"
