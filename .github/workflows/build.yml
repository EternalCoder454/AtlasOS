name: Build AtlasOS

on:
  push:
    branches: [main, beta]
    paths-ignore: ["**.md"]
    # Tags build and lint (on the VPS runner) but publish nothing: :stable
    # comes from promote-stable.yml. Version tags (44.YYYYMMDD-N) belong to
    # the changelog's releases and build nothing.
    tags: ["*", "!44.*"]
  pull_request:
    branches: [main, beta]
  # Daily, to pick up Fedora's updates. Skipped when neither the base image
  # nor this repo changed since the last published build; see "Decide".
  # The weekly stable release is promote-stable.yml, which copies the newest
  # testing image instead of building again.
  schedule:
    - cron: "05 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its running build. Branch builds
# finish, so a cancel can't leave the tags half-pushed or an image unsigned.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Registry paths must be lowercase.
  IMAGE_REGISTRY: ghcr.io/eternalcoder454
  IMAGE_NAME: atlasos
  NVIDIA_IMAGE: atlasos-nvidia
  BASE_IMAGE: quay.io/fedora/fedora-kinoite:44

jobs:
  # Where the builds run (CI.md): the VPS runner (the self-hosted runner
  # labelled atlasos-vps) for pushes to main, the daily schedule, manual runs on
  # main and tags; GitHub's runners for pull requests and beta. When the VPS
  # runner is offline, or its status can't be read, GitHub's runners build
  # everything.
  runner:
    name: Pick a runner
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      kind: ${{ steps.pick.outputs.kind }}
    steps:
      - name: Pick
        id: pick
        env:
          # A fine-grained token for this repository with "Administration:
          # read" (listing runners needs it; GITHUB_TOKEN can't have it).
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          kind=hosted
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            push:refs/heads/main | schedule:refs/heads/main | workflow_dispatch:refs/heads/main | push:refs/tags/*)
              if [ -z "$GH_TOKEN" ]; then
                echo "::notice::No RUNNER_STATUS_TOKEN secret, so the VPS runner can't be checked; building on GitHub's runner."
              elif status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" \
                --jq '[.runners[] | select(any(.labels[]; .name == "atlasos-vps")) | .status] | if index("online") then "online" else "offline" end' 2>"$RUNNER_TEMP/gh.err"); then
                if [ "$status" = online ]; then
                  kind=vps
                else
                  echo "::notice::The VPS runner is offline; building on GitHub's runner."
                fi
              else
                echo "::warning::Couldn't read the VPS runner's status ($(tr '\n' ' ' <"$RUNNER_TEMP/gh.err")); building on GitHub's runner."
              fi
              ;;
          esac
          if [ "$kind" = vps ]; then
            labels='["self-hosted","atlasos-vps"]'
          else
            labels='"ubuntu-26.04"'
          fi
          echo "Runner: $kind"
          {
            echo "kind=$kind"
            echo "labels=$labels"
          } >>"$GITHUB_OUTPUT"

  build:
    # The runner kind in the name is what scripts/ci-times.sh sorts by.
    name: Build and push (${{ needs.runner.outputs.kind }})
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Atlas apps and atlas-framework go in at the commits pinned in
      # atlas-apps.lock (`just pins`), never at whatever their main branch
      # holds when a build starts: an app's new version reaches the image
      # only through a commit here that moves its pin. Each pin must be on
      # its repository's main branch (a commit that only exists in a fork
      # can still be fetched through the parent by its hash) and match its
      # release tag where it has one.
      - name: Read the Atlas app pins
        id: pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/atlas-pins.py verify
          for n in framework updater monitor notepad settings wizard store explorer archive installer; do
            sha=$(scripts/atlas-pins.py get "$n")
            echo "$n=$sha" >>"$GITHUB_OUTPUT"
          done

      # atlas-framework's source (pinned), the atlas-framework build context:
      # the Containerfile builds Atlas.Ui's RPMs from it, and the apps
      # against them. If the repository is private, store a token that can
      # read it in the ATLAS_FRAMEWORK_TOKEN secret.
      - name: Checkout atlas-framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlas-framework
          ref: ${{ steps.pins.outputs.framework }}
          path: atlas-framework
          token: ${{ secrets.ATLAS_FRAMEWORK_TOKEN || github.token }}
          # Only the checkout needs the token: don't leave it in .git/config
          # on the self-hosted runner.
          persist-credentials: false

      # The Atlas apps' source (Atlas Updater and atlas-system-helper, pinned): the
      # Containerfile builds their RPMs from it. If the repository is private,
      # store a token that can read it in the ATLAS_UPDATER_TOKEN secret.
      - name: Checkout Atlas Updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-updater
          ref: ${{ steps.pins.outputs.updater }}
          path: atlas-updater
          token: ${{ secrets.ATLAS_UPDATER_TOKEN || github.token }}
          persist-credentials: false

      # Atlas Monitor's source (pinned), the atlas-monitor build context. The
      # repository is public.
      - name: Checkout Atlas Monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-monitor
          ref: ${{ steps.pins.outputs.monitor }}
          path: atlas-monitor
          persist-credentials: false

      # Atlas Notepad's source (pinned), the atlas-notepad build context. The
      # repository is public.
      - name: Checkout Atlas Notepad
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-notepad
          ref: ${{ steps.pins.outputs.notepad }}
          path: atlas-notepad
          persist-credentials: false

      # Atlas Settings' source (pinned), the atlas-settings build context.
      - name: Checkout Atlas Settings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-settings
          ref: ${{ steps.pins.outputs.settings }}
          path: atlas-settings
          persist-credentials: false

      # Atlas Wizard's source (pinned), the atlas-wizard build context.
      - name: Checkout Atlas Wizard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-wizard
          ref: ${{ steps.pins.outputs.wizard }}
          path: atlas-wizard
          persist-credentials: false

      # Atlas Store's source (pinned), the atlas-store build context.
      - name: Checkout Atlas Store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-store
          ref: ${{ steps.pins.outputs.store }}
          path: atlas-store
          persist-credentials: false

      # Atlas Explorer's source (pinned), the atlas-explorer build context.
      - name: Checkout Atlas Explorer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-explorer
          ref: ${{ steps.pins.outputs.explorer }}
          path: atlas-explorer
          persist-credentials: false

      # Atlas Archive's source (pinned), the atlas-archive build context.
      - name: Checkout Atlas Archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-archive
          ref: ${{ steps.pins.outputs.archive }}
          path: atlas-archive
          persist-credentials: false

      # Atlas Installer's source (pinned): its firstboot/ files, the
      # atlas-installer build context (no RPM).
      - name: Checkout Atlas Installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: EternalCoder454/atlasos-installer
          ref: ${{ steps.pins.outputs.installer }}
          path: atlas-installer
          persist-credentials: false

      # main publishes :testing, beta publishes :beta. (:stable and :latest
      # come from promote-stable.yml.) Pull requests and tags build and
      # lint but never push.
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_KEY_SET: ${{ secrets.NVIDIA_SIGNING_KEY != '' }}
        run: |
          # The full ref: a tag named "main" must not publish :testing.
          case "${GITHUB_REF}" in
            refs/heads/main) tag="testing" ;;
            refs/heads/beta) tag="beta" ;;
            *) tag="pr" ;;
          esac
          push=false
          if [ "${GITHUB_EVENT_NAME}" != pull_request ] && [ "$tag" != pr ]; then
            push=true
          fi

          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }

          # skopeo's registry login, in a file only this job reads rather than
          # on its command line, where other processes on the VPS runner could
          # read the token. printf is a shell builtin: the token is in no argv.
          auth="$RUNNER_TEMP/decide-auth.json"
          trap 'rm -f "$auth"' EXIT
          (umask 077; printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' \
            "$(printf '%s:%s' "$GITHUB_ACTOR" "$GH_TOKEN" | base64 -w0)" >"$auth")

          # The Kinoite build to use, by digest, so the image records exactly
          # what it was built on.
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://${BASE_IMAGE}")
          base="${BASE_IMAGE}@${digest}"

          # A scheduled run with nothing new to build stops here: the image
          # already published for this branch was built from this commit on
          # this same Kinoite. That saves a whole build most days.
          skip=false
          framework=$(git -C atlas-framework rev-parse HEAD)
          updater=$(git -C atlas-updater rev-parse HEAD)
          monitor=$(git -C atlas-monitor rev-parse HEAD)
          notepad=$(git -C atlas-notepad rev-parse HEAD)
          settings=$(git -C atlas-settings rev-parse HEAD)
          wizard=$(git -C atlas-wizard rev-parse HEAD)
          store=$(git -C atlas-store rev-parse HEAD)
          explorer=$(git -C atlas-explorer rev-parse HEAD)
          archive=$(git -C atlas-archive rev-parse HEAD)
          installer=$(git -C atlas-installer rev-parse HEAD)
          # What was checked out is what atlas-apps.lock pins, or nothing runs.
          for n in framework updater monitor notepad settings wizard store explorer archive installer; do
            [ "$(git -C "atlas-$n" rev-parse HEAD)" = "$(scripts/atlas-pins.py get "$n")" ] ||
              { echo "::error::atlas-$n isn't at its pinned commit"; exit 1; }
          done

          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            # No published image yet (or the registry is down) means build.
            labels='{}'
            if json=$(skopeo inspect --authfile "$auth" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}" 2>/dev/null); then
              labels=$(jq -c '.Labels // {}' <<<"$json")
            fi
            if [ "$(jq -r '."org.atlasos.base-image" // ""' <<<"$labels")" = "$base" ] &&
               [ "$(jq -r '."net.eterneon.atlas.framework.revision" // ""' <<<"$labels")" = "$framework" ] &&
               [ "$(jq -r '."net.eterneon.atlas.updater.revision" // ""' <<<"$labels")" = "$updater" ] &&
               [ "$(jq -r '."net.eterneon.atlas.monitor.revision" // ""' <<<"$labels")" = "$monitor" ] &&
               [ "$(jq -r '."net.eterneon.atlas.notepad.revision" // ""' <<<"$labels")" = "$notepad" ] &&
               [ "$(jq -r '."net.eterneon.atlas.settings.revision" // ""' <<<"$labels")" = "$settings" ] &&
               [ "$(jq -r '."net.eterneon.atlas.wizard.revision" // ""' <<<"$labels")" = "$wizard" ] &&
               [ "$(jq -r '."net.eterneon.atlas.store.revision" // ""' <<<"$labels")" = "$store" ] &&
               [ "$(jq -r '."net.eterneon.atlas.explorer.revision" // ""' <<<"$labels")" = "$explorer" ] &&
               [ "$(jq -r '."net.eterneon.atlas.archive.revision" // ""' <<<"$labels")" = "$archive" ] &&
               [ "$(jq -r '."net.eterneon.atlas.installer.revision" // ""' <<<"$labels")" = "$installer" ] &&
               [ "$(jq -r '."org.opencontainers.image.revision" // ""' <<<"$labels")" = "${GITHUB_SHA}" ]; then
              skip=true
            fi
            # atlasos-nvidia only builds on a pushed atlasos, so a failed
            # NVIDIA build would otherwise stay stale until the next commit.
            # Its labels come from the atlasos image it was built on.
            if [ "$skip" = true ] && [ "$NVIDIA_KEY_SET" = true ]; then
              nv='{}'
              if json=$(skopeo inspect --authfile "$auth" \
                "docker://${IMAGE_REGISTRY}/atlasos-nvidia:${tag}" 2>/dev/null); then
                nv=$(jq -c '.Labels // {}' <<<"$json")
              fi
              if [ "$(jq -r '."org.opencontainers.image.version" // ""' <<<"$nv")" != \
                 "$(jq -r '."org.opencontainers.image.version" // ""' <<<"$labels")" ] ||
                 [ "$(jq -r '."org.opencontainers.image.revision" // ""' <<<"$nv")" != "${GITHUB_SHA}" ]; then
                skip=false
                echo "::notice::atlasos-nvidia:${tag} is behind atlasos; building both."
              fi
            fi
            [ "$skip" = false ] || echo "::notice::Nothing new since the last ${tag} build; skipping."
          fi

          # Builds are numbered within their UTC day: 44.YYYYMMDD-1, -2, ...
          # The next number is one past the highest any channel pushed today
          # (testing-, beta- and the stable tags all end in the version), so
          # every image has its own version and its own changelog entry.
          # Push checks again that no other channel took the number meanwhile.
          date=$(date -u +%Y%m%d)
          version=""
          if [ "$skip" != true ]; then
            tags=""
            if out=$(skopeo list-tags --authfile "$auth" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}" 2>"$RUNNER_TEMP/list-tags.err"); then
              tags=$(jq -r '.Tags[]?' <<<"$out")
            # A repository with no image yet has no tags; anything else is an
            # error when this build publishes.
            elif [ "$push" = true ] && ! grep -qiE 'name unknown|not found' "$RUNNER_TEMP/list-tags.err"; then
              echo "::error::Can't list ${IMAGE_NAME}'s tags to number this build: $(cat "$RUNNER_TEMP/list-tags.err")"
              exit 1
            fi
            n=$(grep -oE "44\.${date}-[0-9]+$" <<<"$tags" | sed 's/.*-//' | sort -n | tail -n 1 || true)
            version="44.${date}-$(( ${n:-0} + 1 ))"
          fi
          {
            echo "tag=$tag"
            echo "push=$push"
            echo "base=$base"
            echo "framework=$framework"
            echo "updater=$updater"
            echo "monitor=$monitor"
            echo "notepad=$notepad"
            echo "settings=$settings"
            echo "wizard=$wizard"
            echo "store=$store"
            echo "explorer=$explorer"
            echo "archive=$archive"
            echo "installer=$installer"
            echo "skip=$skip"
            echo "date=$date"
            echo "version=$version"
            echo "week=$(date -u +%G-W%V)"
          } >>"$GITHUB_OUTPUT"

      - name: Install just
        if: steps.decide.outputs.skip != 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Lint
        if: steps.decide.outputs.skip != 'true'
        run: just lint

      # The runner's disk is too small for a 7 GB image, its rechunked copy
      # (2.7 GB with zstd; 5.6 GB at the peak of rechunking) and
      # Podman's working space without clearing the preinstalled SDKs.
      # (Not on the VPS, whose disk keeps the caches.)
      - name: Maximize build space
        if: steps.decide.outputs.skip != 'true' && needs.runner.outputs.kind == 'hosted'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # dnf's metadata and packages, bound into the build at /var/cache/libdnf5
      # by `just build`. Keyed by the week, so it follows Fedora's updates: a
      # new week starts from the last one's and saves once. (A key that never
      # changes is an exact hit forever, is never saved again, and goes stale.)
      # The VPS keeps its own in ATLAS_DNF_CACHE, with Podman's layer cache and
      # the Rust build cache.
      - name: Cache dnf downloads
        if: steps.decide.outputs.skip != 'true' && needs.runner.outputs.kind == 'hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/dnf
          key: dnf-f44-${{ steps.decide.outputs.week }}
          restore-keys: dnf-f44-

      - name: Build
        if: steps.decide.outputs.skip != 'true'
        env:
          IMAGE_VERSION: ${{ steps.decide.outputs.version }}
          # `just build` passes this as the atlas-framework build context,
          ATLAS_FRAMEWORK_SRC: ${{ github.workspace }}/atlas-framework
          # this as the atlas-updater one,
          ATLAS_UPDATER_SRC: ${{ github.workspace }}/atlas-updater
          # this as the atlas-monitor one,
          ATLAS_MONITOR_SRC: ${{ github.workspace }}/atlas-monitor
          # this as the atlas-notepad one,
          ATLAS_NOTEPAD_SRC: ${{ github.workspace }}/atlas-notepad
          # this as the atlas-settings one,
          ATLAS_SETTINGS_SRC: ${{ github.workspace }}/atlas-settings
          # this as the atlas-wizard one,
          ATLAS_WIZARD_SRC: ${{ github.workspace }}/atlas-wizard
          # this as the atlas-store one,
          ATLAS_STORE_SRC: ${{ github.workspace }}/atlas-store
          # this as the atlas-explorer one,
          ATLAS_EXPLORER_SRC: ${{ github.workspace }}/atlas-explorer
          # the atlas-archive one,
          ATLAS_ARCHIVE_SRC: ${{ github.workspace }}/atlas-archive
          # and this as the atlas-installer one.
          ATLAS_INSTALLER_SRC: ${{ github.workspace }}/atlas-installer
        run: |
          just build "${{ steps.decide.outputs.tag }}" \
            --build-arg BASE_IMAGE="${{ steps.decide.outputs.base }}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label net.eterneon.atlas.framework.revision="${{ steps.decide.outputs.framework }}" \
            --label net.eterneon.atlas.updater.revision="${{ steps.decide.outputs.updater }}" \
            --label net.eterneon.atlas.monitor.revision="${{ steps.decide.outputs.monitor }}" \
            --label net.eterneon.atlas.notepad.revision="${{ steps.decide.outputs.notepad }}" \
            --label net.eterneon.atlas.settings.revision="${{ steps.decide.outputs.settings }}" \
            --label net.eterneon.atlas.wizard.revision="${{ steps.decide.outputs.wizard }}" \
            --label net.eterneon.atlas.store.revision="${{ steps.decide.outputs.store }}" \
            --label net.eterneon.atlas.explorer.revision="${{ steps.decide.outputs.explorer }}" \
            --label net.eterneon.atlas.archive.revision="${{ steps.decide.outputs.archive }}" \
            --label net.eterneon.atlas.installer.revision="${{ steps.decide.outputs.installer }}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.url="https://github.com/${GITHUB_REPOSITORY}"
          # Each week's cache starts from the last one, so drop packages
          # nothing has downloaded for a month before it is saved.
          find "${ATLAS_DNF_CACHE:-build/cache/dnf}" -name '*.rpm' -mtime +30 -delete

      # The build time as a label, set on the built image: only its metadata
      # changes (no layer).
      - name: Label the build time
        if: steps.decide.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ref="localhost/${IMAGE_NAME}:${{ steps.decide.outputs.tag }}"
          ctx=$(mktemp -d)
          printf 'FROM %s\n' "$ref" >"$ctx/Containerfile"
          # org.atlasos.built: when this build ran (epoch seconds). The image's
          # Created time is the commit's (SOURCE_DATE_EPOCH in rechunk), so the
          # fast promotion's 24-hour soak goes by this instead. Signed with
          # the rest of the config.
          built=$(date -u +%s)
          podman build --pull=never --label "org.atlasos.built=${built}" \
            --file "$ctx/Containerfile" --tag "$ref" "$ctx"
          rm -rf "$ctx"
          [ "$(podman image inspect --format '{{index .Labels "org.atlasos.built"}}' "$ref")" = "$built" ]

      # Smaller updates for users. Only for images that get pushed. Into an
      # OCI directory in the job's temporary directory, which the runner
      # empties after the job; Push uploads it from there as it is.
      - name: Rechunk
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        run: just rechunk "${{ steps.decide.outputs.tag }}" "${IMAGE_NAME}" "${RUNNER_TEMP:?}/rechunked"

      # What the image contains (an SPDX SBOM of its packages, from syft) and
      # its known vulnerabilities (grype), before anything is pushed: a
      # Critical vulnerability with a fix available stops the build, so it
      # never reaches the tag. `just sbom` makes the SBOM and a full report
      # (kept, with the SBOM, as the run's artifact); the gate reads the SBOM
      # again with `--only-fixed --fail-on critical`, minus .grype.yaml's
      # ignore list (a reason and an end date for every entry). The scanners
      # are the container images Justfile pins by digest. grype has no Fedora
      # data, so this covers the Go and Python modules built into programs,
      # not the RPMs (Fedora's updates fix those; the daily build takes them).
      # The vulnerability database is downloaded each time (3 tries); if it
      # can't be, the build fails rather than push unchecked. Exit code 2 is
      # grype's "a finding crossed the threshold", which is not retried.
      - name: Scan atlasos
        id: sbom
        if: steps.decide.outputs.skip != 'true'
        timeout-minutes: 45
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sbom"
          mkdir -p "$out"
          for try in 1 2 3; do
            just sbom "${{ steps.decide.outputs.tag }}" "$out" && break
            [ "$try" -lt 3 ] || { echo "::error::The SBOM and vulnerability scan failed 3 times."; exit 1; }
            sleep $((try * 30))
          done
          {
            echo "### Vulnerabilities in atlasos:${{ steps.decide.outputs.tag }}"
            echo
            jq -r '[.matches[].vulnerability.severity] | group_by(.) | map("- \(.[0]): \(length)") | .[]' \
              "$out/vulnerabilities.json"
          } >>"$GITHUB_STEP_SUMMARY"
          # The gate only means something if the scan saw the image: "nothing
          # found" must not be "nothing catalogued" (an empty mount, a syft
          # change). The image has about 1,900 RPMs and 1,000 Go modules.
          jq -e '[.packages[].externalRefs[]?.referenceLocator | select(startswith("pkg:rpm/"))] | length >= 1000' \
            "$out/sbom.spdx.json" >/dev/null &&
            jq -e '[.packages[].externalRefs[]?.referenceLocator | select(startswith("pkg:golang/"))] | length >= 100' \
              "$out/sbom.spdx.json" >/dev/null ||
            { echo "::error::The SBOM couldn't be read, or lists too few packages (under 1,000 RPMs or 100 Go modules): the scan didn't see the image."; exit 1; }
          # The gate.
          db=$(mktemp -d "$RUNNER_TEMP/grype-db.XXXXXX")
          ignores=$(mktemp "$RUNNER_TEMP/grype-ignores.XXXXXX")
          trap 'rm -rf "$db" "$ignores"' EXIT
          grype=$(just --evaluate grype)
          # grype matches against this release's data: the Fedora of BASE_IMAGE.
          distro=fedora:44
          # .grype.yaml without the ignores whose "until" date has passed.
          scripts/grype-ignores.sh >"$ignores"
          for try in 1 2 3; do
            rc=0
            podman run --rm --pull=missing --security-opt label=disable --user 0 \
              --mount=type=bind,src="$out",target=/out,ro \
              --mount=type=bind,src="$db",target=/db,rw \
              --mount=type=bind,src="$ignores",target=/grype.yaml,ro \
              -e GRYPE_DB_CACHE_DIR=/db -e GRYPE_DB_UPDATE_DOWNLOAD_TIMEOUT=10m \
              "$grype" sbom:/out/sbom.spdx.json --distro "$distro" -c /grype.yaml \
              --only-fixed --fail-on critical -o table >"$out/gate.txt" || rc=$?
            [ "$rc" -ne 1 ] && break
            [ "$try" -lt 3 ] || break
            sleep $((try * 30))
          done
          {
            echo
            echo "Fixable vulnerabilities (gate, minus .grype.yaml):"
            echo '```'
            head -n 40 "$out/gate.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$out/gate.txt"
          if [ "$rc" -eq 2 ]; then
            echo "::error::atlasos has a Critical vulnerability with a fix available (table above); not pushing."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::The vulnerability gate failed to run (grype exit $rc); not pushing."
            exit 1
          fi

      - name: Upload the SBOM and scan
        if: always() && steps.sbom.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.decide.outputs.tag }}
          path: ${{ runner.temp }}/sbom/
          retention-days: 30
          if-no-files-found: ignore

      # Images are signed with the cosign key in the SIGNING_SECRET repository
      # secret (DEV.md). With cosign.pub in the repo, the image only accepts
      # updates signed with its key (build.sh), so without the secret, or
      # with a key that isn't cosign.pub's, nothing is pushed. (If signing
      # itself fails after the push, the tag holds an unsigned image that
      # verified installs refuse until the next build; promote-stable.yml
      # never copies an image that doesn't verify.)
      - name: Check for a signing key
        id: signing
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -n "$SIGNING_SECRET" ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          elif [ -f cosign.pub ]; then
            echo "::error::cosign.pub is in the repo but the SIGNING_SECRET secret is empty; not pushing an unsigned image."
            exit 1
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.signing.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      # A secret holding some other key would sign images that no install
      # accepts: caught here, before anything is pushed.
      - name: Check the key matches cosign.pub
        if: steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          [ -f cosign.pub ] || exit 0
          cosign public-key --key env://COSIGN_PRIVATE_KEY >"$RUNNER_TEMP/secret.pub"
          if ! cmp -s <(tr -d '[:space:]' <"$RUNNER_TEMP/secret.pub") <(tr -d '[:space:]' <cosign.pub); then
            echo "::error::SIGNING_SECRET's public key is not cosign.pub; not pushing."
            exit 1
          fi

      - name: Log in to ghcr.io
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # In this job's temporary directory, which the runner empties after
          # every job, so no credentials stay behind on the VPS runner. Podman
          # and skopeo read REGISTRY_AUTH_FILE, cosign reads DOCKER_CONFIG.
          mkdir -p "$RUNNER_TEMP/auth"
          {
            echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth/config.json"
            echo "DOCKER_CONFIG=$RUNNER_TEMP/auth"
          } >>"$GITHUB_ENV"
          printf '%s' "$TOKEN" | podman login --authfile "$RUNNER_TEMP/auth/config.json" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io

      # testing -> testing, testing-44.YYYYMMDD-N; beta -> beta, beta-44.YYYYMMDD-N.
      # The version is the one in the image's org.opencontainers.image.version
      # label (set by `just build` from IMAGE_VERSION).
      - name: Push
        id: push
        if: steps.decide.outputs.skip != 'true' && steps.decide.outputs.push == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          version="${{ steps.decide.outputs.version }}"
          src="oci:$RUNNER_TEMP/rechunked:${tag}"
          have=$(skopeo inspect --config "$src" |
            jq -r '.config.Labels["org.opencontainers.image.version"]')
          [ "$have" = "$version" ] || { echo "label says $have, tag says $version" >&2; exit 1; }
          # A build on another channel (main and beta run side by side) may
          # have taken this number since Decide: two images must never share a
          # version, so this one stops and the next run takes a new number.
          existing=$(skopeo list-tags "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}" | jq -r '.Tags[]?')
          if grep -qE "(^|-)${version//./\\.}$" <<<"$existing"; then
            echo "::error::Version ${version} was taken while this build ran; run it again."
            exit 1
          fi
          # The layers go up as `just rechunk` compressed them (zstd), and the registry
          # already has every one that didn't change.
          tags=("$tag" "$tag-$version")
          for t in "${tags[@]}"; do
            skopeo copy --preserve-digests --retry-times 3 --digestfile "$RUNNER_TEMP/digest" \
              "$src" "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${t}"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >>"$GITHUB_OUTPUT"

      - name: Sign
        if: steps.push.outcome == 'success' && steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          # Empty unless the key was made with a password (see the README).
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # The old bundle format is what rpm-ostree and containers/image can
          # verify (containers/container-libs#388, coreos/rpm-ostree#5509).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
          # The key in the secret has to be the one the image checks with.
          scripts/verify-image.sh "${IMAGE_REGISTRY}/${IMAGE_NAME}" "${{ steps.push.outputs.digest }}" >/dev/null

      # The SBOM, signed with the same key, beside the image on the registry
      # (`cosign download attestation`), then checked against cosign.pub.
      - name: Attest the SBOM
        if: steps.push.outcome == 'success' && steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          ref="${IMAGE_REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
          # 20 MB, too big for the public transparency log, so it stays out
          # of it (as the signature does).
          # 3 tries (a 20 MB upload): the image is already pushed and signed,
          # and a rerun of the same commit skips the build, so this is the one
          # chance to attest this digest.
          for try in 1 2 3; do
            timeout 180 cosign attest -y --new-bundle-format=false --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY --type spdxjson --tlog-upload=false \
              --predicate "$RUNNER_TEMP/sbom/sbom.spdx.json" "$ref" && break
            [ "$try" -lt 3 ] || { echo "::error::Couldn't attest the SBOM to $ref (3 tries)."; exit 1; }
            sleep $((try * 30))
          done
          # Both images share the key, so check that what verifies names this
          # image's digest (as scripts/verify-image.sh does for signatures).
          trap 'rm -f "$RUNNER_TEMP/attestation.json"' EXIT
          for try in 1 2 3; do
            timeout 180 cosign verify-attestation --type spdxjson --insecure-ignore-tlog=true \
              --key cosign.pub "$ref" >"$RUNNER_TEMP/attestation.json" && break
            [ "$try" -lt 3 ] || { echo "::error::The SBOM attestation on $ref doesn't verify (3 tries)."; exit 1; }
            sleep $((try * 30))
          done
          jq -e -s --arg d "${ref##*@sha256:}" \
            'length > 0 and all(.[]; .payload | @base64d | fromjson | any(.subject[]; .digest.sha256 == $d))' \
            "$RUNNER_TEMP/attestation.json" >/dev/null ||
            { echo "::error::The SBOM attestation doesn't name $ref (or couldn't be read)."; exit 1; }

      # atlasos-nvidia: this image plus NVIDIA's driver (Containerfile.nvidia),
      # with the same tags. It builds on the image `just build` left in
      # Podman's storage, with the same files and labels as the one just
      # pushed and every layer already there: the pushed (rechunked) image
      # shares none, so it would be another 9 GB download, more than the VPS
      # runner's disk has room for beside its cache. Its kernel modules are
      # signed with the AtlasOS module key, which CI reads from the
      # NVIDIA_SIGNING_KEY secret (see DEV.md); without it this only leaves a
      # notice. Pull requests don't build it, and neither does a run whose
      # atlasos steps failed after the push (signing): the next run does.
      - name: Check for the module signing key
        id: nvidia
        if: steps.push.outcome == 'success'
        env:
          KEY: ${{ secrets.NVIDIA_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::No NVIDIA_SIGNING_KEY secret; atlasos-nvidia not built."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Build NVIDIA
        if: steps.nvidia.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.NVIDIA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/nvidia-signing.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$KEY" >"$key")
          # atlasos's rechunked copy is pushed: its 2.7 GB go before this build
          # needs the space. On a GitHub-hosted runner, so do the build's
          # intermediate images, which no later run reuses.
          rm -rf "${RUNNER_TEMP:?}/rechunked"
          if [ "${{ needs.runner.outputs.kind }}" = hosted ]; then
            podman image prune -f
          fi
          NVIDIA_SIGNING_KEY="$key" just build-nvidia "${{ steps.decide.outputs.tag }}"

      # Into the same directory, which `just rechunk` empties: atlasos is
      # pushed by now.
      - name: Rechunk NVIDIA
        if: steps.nvidia.outputs.enabled == 'true'
        run: just rechunk "${{ steps.decide.outputs.tag }}" "${NVIDIA_IMAGE}" "${RUNNER_TEMP:?}/rechunked"

      # What the image contains (an SPDX SBOM of its packages, from syft) and
      # its known vulnerabilities (grype), before anything is pushed: a
      # Critical vulnerability with a fix available stops the build, so it
      # never reaches the tag. `just sbom` makes the SBOM and a full report
      # (kept, with the SBOM, as the run's artifact); the gate reads the SBOM
      # again with `--only-fixed --fail-on critical`, minus .grype.yaml's
      # ignore list (a reason and an end date for every entry). The scanners
      # are the container images Justfile pins by digest. grype has no Fedora
      # data, so this covers the Go and Python modules built into programs,
      # not the RPMs (Fedora's updates fix those; the daily build takes them).
      # The vulnerability database is downloaded each time (3 tries); if it
      # can't be, the build fails rather than push unchecked. Exit code 2 is
      # grype's "a finding crossed the threshold", which is not retried.
      - name: Scan atlasos-nvidia
        id: sbom-nvidia
        if: steps.nvidia.outputs.enabled == 'true'
        timeout-minutes: 45
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sbom-nvidia"
          mkdir -p "$out"
          for try in 1 2 3; do
            just sbom "${{ steps.decide.outputs.tag }}" "$out" atlasos-nvidia && break
            [ "$try" -lt 3 ] || { echo "::error::The SBOM and vulnerability scan failed 3 times."; exit 1; }
            sleep $((try * 30))
          done
          {
            echo "### Vulnerabilities in atlasos-nvidia:${{ steps.decide.outputs.tag }}"
            echo
            jq -r '[.matches[].vulnerability.severity] | group_by(.) | map("- \(.[0]): \(length)") | .[]' \
              "$out/vulnerabilities.json"
          } >>"$GITHUB_STEP_SUMMARY"
          # The gate only means something if the scan saw the image: "nothing
          # found" must not be "nothing catalogued" (an empty mount, a syft
          # change). The image has about 1,900 RPMs and 1,000 Go modules.
          jq -e '[.packages[].externalRefs[]?.referenceLocator | select(startswith("pkg:rpm/"))] | length >= 1000' \
            "$out/sbom.spdx.json" >/dev/null &&
            jq -e '[.packages[].externalRefs[]?.referenceLocator | select(startswith("pkg:golang/"))] | length >= 100' \
              "$out/sbom.spdx.json" >/dev/null ||
            { echo "::error::The SBOM couldn't be read, or lists too few packages (under 1,000 RPMs or 100 Go modules): the scan didn't see the image."; exit 1; }
          # The gate.
          db=$(mktemp -d "$RUNNER_TEMP/grype-db.XXXXXX")
          ignores=$(mktemp "$RUNNER_TEMP/grype-ignores.XXXXXX")
          trap 'rm -rf "$db" "$ignores"' EXIT
          grype=$(just --evaluate grype)
          # grype matches against this release's data: the Fedora of BASE_IMAGE.
          distro=fedora:44
          # .grype.yaml without the ignores whose "until" date has passed.
          scripts/grype-ignores.sh >"$ignores"
          for try in 1 2 3; do
            rc=0
            podman run --rm --pull=missing --security-opt label=disable --user 0 \
              --mount=type=bind,src="$out",target=/out,ro \
              --mount=type=bind,src="$db",target=/db,rw \
              --mount=type=bind,src="$ignores",target=/grype.yaml,ro \
              -e GRYPE_DB_CACHE_DIR=/db -e GRYPE_DB_UPDATE_DOWNLOAD_TIMEOUT=10m \
              "$grype" sbom:/out/sbom.spdx.json --distro "$distro" -c /grype.yaml \
              --only-fixed --fail-on critical -o table >"$out/gate.txt" || rc=$?
            [ "$rc" -ne 1 ] && break
            [ "$try" -lt 3 ] || break
            sleep $((try * 30))
          done
          {
            echo
            echo "Fixable vulnerabilities (gate, minus .grype.yaml):"
            echo '```'
            head -n 40 "$out/gate.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$out/gate.txt"
          if [ "$rc" -eq 2 ]; then
            echo "::error::atlasos-nvidia has a Critical vulnerability with a fix available (table above); not pushing."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::The vulnerability gate failed to run (grype exit $rc); not pushing."
            exit 1
          fi

      - name: Upload the SBOM and scan (NVIDIA)
        if: always() && steps.sbom-nvidia.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-nvidia-${{ steps.decide.outputs.tag }}
          path: ${{ runner.temp }}/sbom-nvidia/
          retention-days: 30
          if-no-files-found: ignore

      - name: Push NVIDIA
        id: push-nvidia
        if: steps.nvidia.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          version="${{ steps.decide.outputs.version }}"
          src="oci:$RUNNER_TEMP/rechunked:${tag}"
          have=$(skopeo inspect --config "$src" |
            jq -r '.config.Labels["org.opencontainers.image.version"]')
          [ "$have" = "$version" ] || { echo "label says $have, tag says $version" >&2; exit 1; }
          for t in "$tag" "$tag-$version"; do
            skopeo copy --preserve-digests --retry-times 3 --digestfile "$RUNNER_TEMP/digest" \
              "$src" "docker://${IMAGE_REGISTRY}/${NVIDIA_IMAGE}:${t}"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >>"$GITHUB_OUTPUT"

      - name: Sign NVIDIA
        if: steps.push-nvidia.outcome == 'success' && steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${NVIDIA_IMAGE}@${{ steps.push-nvidia.outputs.digest }}"
          scripts/verify-image.sh "${IMAGE_REGISTRY}/${NVIDIA_IMAGE}" "${{ steps.push-nvidia.outputs.digest }}" >/dev/null

      - name: Attest the NVIDIA SBOM
        if: steps.push-nvidia.outcome == 'success' && steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          ref="${IMAGE_REGISTRY}/${NVIDIA_IMAGE}@${{ steps.push-nvidia.outputs.digest }}"
          # 3 tries (a 20 MB upload): the image is already pushed and signed,
          # and a rerun of the same commit skips the build, so this is the one
          # chance to attest this digest.
          for try in 1 2 3; do
            timeout 180 cosign attest -y --new-bundle-format=false --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY --type spdxjson --tlog-upload=false \
              --predicate "$RUNNER_TEMP/sbom-nvidia/sbom.spdx.json" "$ref" && break
            [ "$try" -lt 3 ] || { echo "::error::Couldn't attest the SBOM to $ref (3 tries)."; exit 1; }
            sleep $((try * 30))
          done
          # Both images share the key, so check that what verifies names this
          # image's digest (as scripts/verify-image.sh does for signatures).
          trap 'rm -f "$RUNNER_TEMP/attestation.json"' EXIT
          for try in 1 2 3; do
            timeout 180 cosign verify-attestation --type spdxjson --insecure-ignore-tlog=true \
              --key cosign.pub "$ref" >"$RUNNER_TEMP/attestation.json" && break
            [ "$try" -lt 3 ] || { echo "::error::The SBOM attestation on $ref doesn't verify (3 tries)."; exit 1; }
            sleep $((try * 30))
          done
          jq -e -s --arg d "${ref##*@sha256:}" \
            'length > 0 and all(.[]; .payload | @base64d | fromjson | any(.subject[]; .digest.sha256 == $d))' \
            "$RUNNER_TEMP/attestation.json" >/dev/null ||
            { echo "::error::The SBOM attestation doesn't name $ref (or couldn't be read)."; exit 1; }
