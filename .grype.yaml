# Ignore list for the CI vulnerability gate (build.yml: grype --only-fixed
# --fail-on critical). Prefer fixing over listing. scripts/grype-ignores.sh
# checks every line: an entry is one line, names the vulnerability and the
# package's exact name, version and type (so another copy, or a newer one that
# is still affected, fails the gate again), and ends with
# "# until YYYY-MM-DD: reason", at most 90 days ahead. Once the date passes the
# entry no longer applies and the gate fails if the fix is still missing:
# delete it, or extend it with a new reason. Anything else is an error.
#
# Entries added 2026-10-04: the affected programs are Fedora's own packages
# (gocryptfs, skopeo, buildah, podman, python3-anyio), not built by this repo.
# The fix has to come from Fedora, which the daily build picks up as soon as
# it ships.
ignore:
  - {vulnerability: GHSA-5cgq-3rg8-m6cv, package: {name: golang.org/x/crypto, version: v0.33.0, type: go-module}} # until 2026-11-04: gocryptfs, Fedora's build
