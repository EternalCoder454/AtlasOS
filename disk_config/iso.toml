# bootc-image-builder config for `just iso-anaconda`, the Anaconda installer.
# After installing from the embedded payload, the system is pointed at the
# published image so `bootc upgrade` follows ghcr.io from then on.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/eternalcoder454/atlasos:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
# No user accounts in the installer: the first-run wizard (plasma-setup)
# creates the first account, and only an account it creates gets the Light or
# Dark look chosen there. (It skips that step when a user already exists.)
disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
  "org.fedoraproject.Anaconda.Modules.Users",
]
