# Swap is zram, compressed RAM, so swapping out is cheap and swapping in has
# no disk to wait for. These are the kernel's and the Arch Wiki's settings for
# swap in RAM: prefer it over dropping file cache (swappiness above 100), and
# read one page at a time (no read-ahead, which only helps disks).
vm.swappiness = 180
vm.page-cluster = 0
# Keep the kernel from reclaiming in bursts after fragmentation events.
# (vm.watermark_scale_factor stays at the kernel's 10: the often-copied 125
# keeps 2.5% of RAM free as headroom, which shows as about 200 MB less
# available memory on 8 GB (measured), a reserve for heavy memory pressure.)
vm.watermark_boost_factor = 0
