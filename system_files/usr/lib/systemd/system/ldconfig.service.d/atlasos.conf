# After every update systemd rebuilds the shared-library cache before the
# login screen starts (7.7 s measured in the VM). The image already ships the
# cache for its own libraries, and ostree puts it in /etc unless /etc's copy
# was changed, so the rebuild only needs to run when /etc's cache or library
# paths differ from the image's (/usr/etc).
[Service]
ExecCondition=/usr/libexec/telamon/ldconfig-needed
