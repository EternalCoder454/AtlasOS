# The man page index is rebuilt by atlasos-mandb.timer once the desktop is up,
# not in the boot path (5.6 s measured in the VM), at the lowest priority, and
# only when the installed packages changed since it last ran (mandb-needed).
[Service]
ExecCondition=/usr/libexec/atlasos/mandb-needed
ExecStartPost=/usr/libexec/atlasos/mandb-needed --done
Nice=19
CPUSchedulingPolicy=idle
IOSchedulingClass=idle
