# Choices made in the first-run wizard that a new user's desktop is set up
# with. AtlasOS's launcher page writes choices.ini here as the wizard's own
# user (plasma-setup); the Global Themes' layout script reads it when a user's
# desktop is first set up. Readable by everyone, so every new user gets it.
d /var/lib/atlasos-setup 0755 plasma-setup plasma-setup -
