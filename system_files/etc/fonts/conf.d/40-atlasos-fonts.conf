<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- IBM Plex Sans first for sans-serif and JetBrains Mono for monospace, so
     GTK apps, Ghostty and web pages match Plasma. Noto still covers the
     scripts they don't. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>
</fontconfig>
