# greenboot (greenboot-rs): boot health checks with automatic rollback.
# How it works, and the AtlasOS checks: see "Boot health checks" in the README.

# Failed boots in a row before the update is rolled back: the first failure
# sets the counter to this and reboots, GRUB counts it down on each boot.
GREENBOOT_MAX_BOOT_ATTEMPTS=3

# The hardware watchdog check is in greenboot-default-health-checks, which
# AtlasOS does not install (its repository DNS check fails offline). Off here
# in case it is ever added.
GREENBOOT_WATCHDOG_CHECK_ENABLED=false

# Health checks to skip, by exact script name.
DISABLED_HEALTHCHECKS=()
